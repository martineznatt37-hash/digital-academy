# Backend Digital Academy — despliega en https://render.com (plan gratis)
# Conecta tu repo de GitHub → New Web Service → Blueprint o manual con rootDir: server

services:
  - type: web
    name: digital-academy-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
